[project]
name = "stocks-fastapi"
version = "0.1.0"
description = "Port of a Spring Boot stock prediction service to FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "pandas",
  "numpy",
  "scikit-learn",
  "schedule",
  "python-dotenv",
  "loguru"
]

[tool.poetry.scripts]
start = "fastapi_app.main:run"
